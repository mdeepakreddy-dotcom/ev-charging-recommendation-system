spring.application.name=ev-smartcharge-api
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:evsmartcharge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always

security.jwt.secret=${JWT_SECRET:local-only-change-this-secret-before-deployment-000000000000000000000000}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
ai.api-key=${AI_API_KEY:}
ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.model=${AI_MODEL:gpt-4o-mini}

spring.jackson.serialization.write-dates-as-timestamps=false
